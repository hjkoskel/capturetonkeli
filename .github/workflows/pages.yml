# GitHub Pages deploy (docs/11 §2): the repo root as it is, plus a generated version.json
# (git describe, tag, branch, commit; docs/04 §19) so the start page shows which version
# is live. Needs repo Settings → Pages → Build and deployment → Source: "GitHub Actions"
# (once; until then this job fails and the old branch deploy keeps serving the site).
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # tags for git describe
      - name: version.json
        run: python3 tools/version_info.py --source pages > version.json && cat version.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: . } # .git and .github are left out by the action
      - id: deployment
        uses: actions/deploy-pages@v4
